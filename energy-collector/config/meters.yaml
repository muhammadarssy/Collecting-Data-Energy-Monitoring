  - id: meter_id3
    label: "Mesin Injeksi 3"
    type: energy
    port: /dev/ttyACM2
    baudrate: 9600
    slave_id: 3
    parity: N
    stopbits: 1
    gpio_pin: 14
    gpio_debounce_ms: 50

  - id: meter_id4
    label: "Mesin Injeksi 4"
    type: energy
    port: /dev/ttyACM3
    baudrate: 9600
    slave_id: 4
    parity: N
    stopbits: 1
    gpio_pin: 15
    gpio_debounce_ms: 50

  - id: utils_id5
    label: "Panel Utilitas 5"
    type: utils
    port: /dev/ttyACM4
    baudrate: 9600
    slave_id: 5
    parity: N
    stopbits: 1

  - id: utils_id5
    label: "Panel Utilitas 6"
    type: utils
    port: /dev/ttyACM5
    baudrate: 9600
    slave_id: 6
    parity: N
    stopbits: 1

