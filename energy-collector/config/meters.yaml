meters:
  # Energy: history DB tiap interval (session lifetime, tanpa cycle_id di reading).
  # GPIO cycle: LOW pertama buka cycle; HIGH singkat = noise (digabung);
  # HIGH >= gpio_noise_delay_ms tutup 1 cycle; LOW >= gpio_standby_low_seconds = mati → reset standby.
  - id: meter_id1
    label: "Mesin Injeksi 1"
    type: energy
    port: /dev/ttyACM4
    baudrate: 9600
    slave_id: 1
    parity: N
    stopbits: 1
    gpio_pin: 27
    gpio_debounce_ms: 500
    gpio_noise_delay_ms: 1000
    gpio_standby_low_seconds: 30

  # - id: meter_id2
  #   label: "Mesin Injeksi 2"
  #   type: energy
  #   port: /dev/ttyACM2
  #   baudrate: 9600
