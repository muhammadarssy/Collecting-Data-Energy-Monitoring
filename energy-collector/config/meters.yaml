  #   stopbits: 1
  #   gpio_pin: 22
  #   gpio_debounce_ms: 500
  #   gpio_noise_delay_ms: 1000
  #   gpio_standby_low_seconds: 30

  - id: meter_id3
    label: "Mesin Injeksi 3"
    type: energy
    port: /dev/ttyACM6
    baudrate: 9600
    slave_id: 3
    parity: N
    stopbits: 1
    gpio_pin: 23
    gpio_debounce_ms: 500
    gpio_noise_delay_ms: 1000
    gpio_standby_low_seconds: 30

  - id: meter_id4
    label: "Mesin Injeksi 4"
    type: energy
    port: /dev/ttyACM7
    baudrate: 9600
    slave_id: 4
    parity: N
    stopbits: 1
    gpio_pin: 24
    gpio_debounce_ms: 500
    gpio_noise_delay_ms: 1000
    gpio_standby_low_seconds: 30

  - id: utils_id5
    label: "Panel Utilitas 5"
    type: utils
    port: /dev/ttyACM0
    baudrate: 9600
    slave_id: 5
    parity: N
    stopbits: 1

  - id: utils_id6
    label: "Panel Utilitas 6"
    type: utils
    port: /dev/ttyACM1
    baudrate: 9600
    slave_id: 6
    parity: N
    stopbits: 1

